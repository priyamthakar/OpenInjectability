[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openinjectability"
dynamic = ["version"]
description = "Transparent Newtonian fluid-resistance assessment for syringe and needle scenarios"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "OpenInjectability contributors"}]
keywords = ["biologics", "formulation", "injectability", "syringeability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
openinjectability = "openinjectability.cli:main"

[project.urls]
Homepage = "https://github.com/priyamthakar/OpenInjectability"
Repository = "https://github.com/priyamthakar/OpenInjectability"
Issues = "https://github.com/priyamthakar/OpenInjectability/issues"
Changelog = "https://github.com/priyamthakar/OpenInjectability/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hypothesis>=6",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "types-PyYAML>=6",
  "tomli>=2; python_version < '3.11'",
]
reports = ["matplotlib>=3.8", "reportlab>=4", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openinjectability = ["validation_registry/*.json"]

[tool.setuptools.dynamic]
version = {attr = "openinjectability._version.__version__"}

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["openinjectability"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "matplotlib.*", "numpy", "numpy.*", "yaml"]
ignore_missing_imports = true
follow_imports = "skip"
