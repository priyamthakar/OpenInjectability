name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(python -c "exec(open('src/openinjectability/_version.py').read()); print(__version__)")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,reports]" twine
      - run: python -m pytest --cov=openinjectability --cov-branch --cov-fail-under=87 -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --strict src
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_distribution.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openinjectability/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
