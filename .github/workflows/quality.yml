name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,reports]"
      - run: python -m pytest --cov=openinjectability --cov-branch --cov-fail-under=87 -q
      - run: python -m ruff check src tests
      - run: python -m mypy --strict src
      - run: python -m build
      - name: Installed wheel smoke
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install matplotlib reportlab
          "$RUNNER_TEMP/wheel-smoke/bin/openinjectability" --version
          "$RUNNER_TEMP/wheel-smoke/bin/openinjectability" assess examples/formulation.csv \
            --results "$RUNNER_TEMP/assessment.json" \
            --report "$RUNNER_TEMP/assessment.md"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import openinjectability; print(openinjectability.__version__)"
